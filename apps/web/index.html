<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="theme-color"
      content="#f3f4f0"
      media="(prefers-color-scheme: light)"
      data-scheme="light"
    />
    <meta
      name="theme-color"
      content="#18221b"
      media="(prefers-color-scheme: dark)"
      data-scheme="dark"
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Disciplined Sidekick</title>
    <!-- Applies the stored theme before first paint, so there is no flash of the
         other theme. Keep in step with applyTheme in src/theme.ts. -->
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("theme");
          if (theme !== "light" && theme !== "dark") return;
          document.documentElement.dataset.theme = theme;
          for (const meta of document.querySelectorAll(
            'meta[name="theme-color"][data-scheme]',
          )) {
            meta.setAttribute(
              "media",
              meta.getAttribute("data-scheme") === theme ? "all" : "not all",
            );
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
